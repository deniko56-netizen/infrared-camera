name: Build Android APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK with Gradle
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK for Artifact
        run: |
          mkdir -p output/
          cp app/build/outputs/apk/debug/app-debug.apk output/InfraredCamera-v1.0.0.apk
          echo "APK successfully generated:"
          ls -lh output/

      - name: Upload APK Artifact (Direct Download)
        uses: actions/upload-artifact@v4
        with:
          name: InfraredCamera-APK
          path: output/InfraredCamera-v1.0.0.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: output/InfraredCamera-v1.0.0.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
